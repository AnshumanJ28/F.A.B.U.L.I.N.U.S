<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.A.B.U.L.I.N.U.S.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="brand">F.A.B.U.L.I.N.U.S.</span>
      <select id="lang-select" class="lang-select" aria-label="Recognition language">
        <option value="en-US">English</option>
      </select>
    </header>

    <main class="stage">
      <div class="left-col">
        <div class="orb-wrap">
          <button id="orb" class="orb" aria-label="Tap to speak" aria-pressed="false">
            <span class="orb-ring orb-ring--glow"></span>
            <span class="orb-core">
              <svg viewBox="0 0 24 24" class="mic-icon" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z" fill="currentColor"/>
                <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z" fill="currentColor"/>
              </svg>
            </span>
          </button>
          <p class="orb-status" id="orb-status">Tap the orb or type below</p>
          <p class="transcript" id="transcript" aria-live="polite"></p>
        </div>

        <form id="text-fallback" class="text-fallback" autocomplete="off">
          <input id="text-input" type="text" placeholder="Type a command instead, e.g. add 2 bottles of water" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div class="right-col">
        <section class="panel list-panel">
          <div class="panel-header">
            <h2 class="panel-title">Shopping list</h2>
            <div style="display: flex; gap: 8px;">
              <button id="clear-list-btn" class="action-btn" aria-label="Clear shopping list" style="background: transparent; border: 1px solid var(--danger); color: var(--danger);">Clear</button>
              <button id="download-list-btn" class="action-btn" aria-label="Download list as text file">Download</button>
            </div>
          </div>
          <div id="list-categories" class="list-categories"></div>
        </section>

        <section class="panel suggestions-panel">
          <h2 class="panel-title">Suggested for you</h2>
          <ul id="suggestions-list" class="suggestions-list"></ul>
        </section>

        <section class="panel search-panel" id="search-panel" hidden>
          <h2 class="panel-title">Search results</h2>
          <ul id="search-results" class="search-results"></ul>
        </section>
      </div>
      
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </main>
  </div>

  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
