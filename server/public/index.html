<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.A.B.U.L.I.N.U.S.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="brand">F.A.B.U.L.I.N.U.S.</span>
      <select id="lang-select" class="lang-select" aria-label="Recognition language">
        <option value="en-US">English</option>
        <option value="hi-IN">Hindi</option>
        <option value="fr-FR">French</option>
        <option value="es-ES">Spanish</option>
      </select>
    </header>

    <main class="stage">
      <div class="left-col">
        <div class="orb-wrap">
          <button id="orb" class="orb" aria-label="Tap to speak" aria-pressed="false">
            <span class="orb-ring orb-ring--glow"></span>
            <span class="orb-core">
              <svg viewBox="0 0 24 24" class="mic-icon" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z" fill="currentColor"/>
                <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z" fill="currentColor"/>
              </svg>
            </span>
          </button>
          <p class="orb-status" id="orb-status">Tap the orb or type below</p>
          <p class="transcript" id="transcript" aria-live="polite"></p>
        </div>

        <form id="text-fallback" class="text-fallback" autocomplete="off">
          <input id="text-input" type="text" placeholder="Type a command instead, e.g. add 2 bottles of water" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div class="right-col">
        <section class="panel list-panel">
          <div class="panel-header">
            <h2 class="panel-title">Shopping list</h2>
            <div style="display: flex; gap: 8px;">
              <button id="clear-list-btn" class="action-btn" aria-label="Clear shopping list" style="background: transparent; border: 1px solid var(--danger); color: var(--danger);">Clear</button>
              <button id="download-list-btn" class="action-btn" aria-label="Download list as text file">Download</button>
            </div>
          </div>
          <div id="list-categories" class="list-categories"></div>
        </section>

        <section class="panel suggestions-panel">
          <h2 class="panel-title">Suggested for you</h2>
          <ul id="suggestions-list" class="suggestions-list"></ul>
        </section>

        <section class="panel search-panel" id="search-panel" hidden>
          <h2 class="panel-title">Search results</h2>
          <ul id="search-results" class="search-results"></ul>
        </section>
      </div>
      
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 AnshumanJ28</p>
      <a href="https://github.com/AnshumanJ28/F.A.B.U.L.I.N.U.S" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.234c-3.338.724-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.744.083-.729.083-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.305-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.91 1.235 3.22 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </footer>
  </div>

  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
